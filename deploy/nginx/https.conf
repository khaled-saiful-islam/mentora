# Production https, mounted by docker-compose.prod.yml. Cloudflare terminates
# the visitor's TLS and connects here with its own; the certificate is a
# Cloudflare Origin Certificate (trusted only by Cloudflare), kept on the server
# in deploy/certs/ and never committed. SSL mode in Cloudflare: Full (strict).
#
# Authenticated Origin Pulls: Cloudflare presents its own client certificate on
# every connection here, and nginx refuses any connection without it. The
# firewall already limits 443 to Cloudflare's ranges, but any Cloudflare
# customer's zone could be pointed at this IP; this makes it answer only ours.
# Turn it on in Cloudflare (SSL/TLS → Origin Server) *before* deploying this,
# or every request gets a 400.

server {
    listen 443 ssl;
    http2 on;
    server_name mentora.stream;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    include /etc/nginx/mentora/site.conf;
}

# www is an alias, not a second site: one canonical address for links and
# cookies.
server {
    listen 443 ssl;
    http2 on;
    server_name www.mentora.stream;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    return 301 https://mentora.stream$request_uri;
}
