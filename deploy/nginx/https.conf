# Production https, mounted by docker-compose.prod.yml. Cloudflare terminates
# the visitor's TLS and connects here with its own; the certificate is a
# Cloudflare Origin Certificate (trusted only by Cloudflare), kept on the server
# in deploy/certs/ and never committed. SSL mode in Cloudflare: Full (strict).
#
# Authenticated Origin Pulls: Cloudflare presents its client certificate on
# every connection here, and nginx refuses any connection without it. That
# certificate is shared by every Cloudflare account, so it proves only that the
# request came through Cloudflare — not through our zone. The firewall says the
# same. What stops another zone pointed at this IP from being served Mentora
# under its own name is the catch-all below, which refuses any hostname that is
# not ours. Turn AOP on in Cloudflare (SSL/TLS → Origin Server) *before*
# deploying this, or every request gets a 400.

# Any other hostname — someone else's domain, or the bare IP: refuse the TLS
# handshake itself, before a certificate or a page is shown.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mentora.stream;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    include /etc/nginx/mentora/site.conf;
}

# www is an alias, not a second site: one canonical address for links and
# cookies.
server {
    listen 443 ssl;
    http2 on;
    server_name www.mentora.stream;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    return 301 https://mentora.stream$request_uri;
}
