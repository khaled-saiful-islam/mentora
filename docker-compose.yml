name: mentora

services:
  db:
    image: postgres:16-alpine
    container_name: mentora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentora}
      POSTGRES_DB: ${POSTGRES_DB:-mentora}
    volumes:
      - mentora-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-8302}:5432"
    healthcheck:
      # The backend waits on this, which is what removes the "run migrations
      # once the database is actually up" manual step.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentora} -d ${POSTGRES_DB:-mentora}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: mentora-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentora}:${POSTGRES_PASSWORD:-mentora}@db:5432/${POSTGRES_DB:-mentora}
    env_file:
      - .env
    volumes:
      # Astra's recorded voice: every lesson's clips, kept across rebuilds.
      - mentora-live-audio:/srv/.cache/live-audio
    ports:
      - "${API_PORT:-8301}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: mentora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8300}:80"

volumes:
  mentora-db:
  mentora-live-audio:
